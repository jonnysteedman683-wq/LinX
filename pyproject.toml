[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linx"
version = "0.1.0"
description = "LinX: one registry, one bus and one control CLI over Jonny's agent systems."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
unisync = ["lestinxor @ git+https://github.com/jonnysteedman683-wq/LESTINXOR-AGENT.git"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
linx = "linx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
linx = ["systems.json"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["lestinxor.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
