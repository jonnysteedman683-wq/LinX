name: CI

on:
  push:
    branches: [main]
  pull_request:
  # lestinxor is installed from its main branch, so a change there can break LinX
  # without any LinX commit. A daily run catches that.
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # LinX runs on the owner's Windows laptop: test the real platform too.
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check . && python -m ruff format --check .
      - name: Type-check
        run: python -m mypy
      - name: Test
        run: python -m pytest --cov=linx --cov-report=term --cov-fail-under=90

  powershell:
    # The Windows setup and task scripts have no unit tests; at least make sure
    # every one of them parses.
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Parse every .ps1
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs) | Out-Null
            if ($errs) { $bad++; $errs | ForEach-Object { Write-Host "::error file=$($_.Extent.File),line=$($_.Extent.StartLineNumber)::$($_.Message)" } }
            else { Write-Host "ok  $($_.FullName)" }
          }
          if ($bad) { exit 1 }
